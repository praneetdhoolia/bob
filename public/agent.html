<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bob · Live</title><link rel="stylesheet" href="/agent.css"><script src="/agent.js" defer></script></head><body>
<svg class="icon-defs" aria-hidden="true"><defs>
<symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 10 6-3v10l-6-3"/><path class="slash" d="m3 3 18 18"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3m-3 0h6"/><path class="slash" d="m3 3 18 18"/></symbol>
<symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/><path class="slash" d="m3 3 18 18"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3zM8 8h8m-8 4h5"/></symbol>
<symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 11v2m4-6v10m5-14v18m5-14v10m4-6v2"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4z"/></symbol>
<symbol id="i-audio" viewBox="0 0 24 24"><path d="M10 17V5l10-2v12M10 8l10-2"/><ellipse cx="7" cy="18" rx="3" ry="3"/><ellipse cx="17" cy="16" rx="3" ry="3"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14m6-14v14"/></symbol>
<symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4m-4 0h8"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 4-8zM8 12h13"/></symbol>
</defs></svg><div id="galaxy" aria-hidden="true"></div>
<header><a class="brand" href="/">bob<span></span></a><span id="presence" role="status">Connecting</span><div class="memory-chip" title="Live system RAM"><span class="memory-dot"></span><span id="ram-label">Memory</span><meter id="ram-meter" min="0" max="100" value="0" aria-label="System memory usage"></meter></div><button id="theme" class="theme-button" aria-label="Theme: System. Switch to Light" title="System theme"><svg><use href="#i-desktop"/></svg></button><button id="pause" class="icon-button" aria-label="Pause agent" title="Pause agent"><svg><use href="#i-pause"/></svg></button></header>
<main class="meeting"><section class="participants" aria-label="Live participants">
<div class="stage glass" role="group" aria-label="Video input"><div id="empty-stage" class="empty-stage"><div class="input-avatar"><svg><use href="#i-camera"/></svg></div></div><video id="video" playsinline hidden></video><img id="processed" alt="Observed video" hidden><svg id="focus" viewBox="0 0 1 1" preserveAspectRatio="none" role="img" aria-label="Approximate visual influence"></svg><span id="stage-label" class="tile-name">Video input</span><span id="video-status" class="tile-status"></span></div>
<div id="participant-resizer" class="resize-handle" role="separator" tabindex="0" aria-label="Resize video and agent tiles" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="65" aria-valuenow="50"></div>
<section id="agent-tile" class="agent-tile glass" aria-label="Bob activity" tabindex="0"><div class="agent-heading"><h2>Bob</h2><button id="state-close" class="icon-button" aria-label="Collapse activity" title="Collapse activity"><svg><use href="#i-close"/></svg></button></div><button id="agent-mute" class="icon-button agent-mute" aria-label="Mute agent" aria-pressed="true" title="Unmute agent"><svg><use href="#i-mic"/></svg></button><div class="face-stage"><canvas id="state-orbit" role="img" aria-label="Live numerical activity around the agent"></canvas><div id="face" class="face" role="img" aria-label="Agent voice"><div class="face-shell"><i></i><i></i><b></b></div></div></div><div id="state-panel" class="activity-deck"><div class="activity-plots"><section class="plot"><h3>Memory<span class="chart-unit" title="Root mean square of numerical state values. Dimensionless.">RMS</span></h3><canvas id="matrix" role="img" aria-label="Pooled RMS energy across numerical memory coordinates" title="Pooled RMS energy. Horizontal axis: pooled memory groups."></canvas></section><section class="plot"><h3>Flow<span class="chart-unit" title="State change in thousandths of a numerical RMS unit. Dimensionless.">mRMS</span></h3><canvas id="flow-chart" role="img" aria-label="Projection change in milli RMS units" title="Recent projection changes, in thousandths of a numerical RMS unit."></canvas></section></div><section class="signal-plot"><div class="signal-heading"><h3>Audio<span class="chart-unit">dBFS</span></h3></div><canvas id="audio-wave" role="img" aria-label="Smooth five-second audio waveform" title="Measured amplitude on a -60 to 0 dBFS scale. Bars stay fixed while the wave passes through their heights over five seconds."></canvas></section><div class="sensor-wrap"><table id="sensors"><caption class="sr-only">Live measurements. Minimum, maximum and average cover this viewing session.</caption><colgroup><col><col><col><col><col></colgroup><thead><tr><th scope="col">Sensor</th><th scope="col">Current</th><th scope="col">Minimum</th><th scope="col">Maximum</th><th scope="col">Average</th></tr></thead><tbody id="sensor-rows"></tbody></table></div></div></section>
</section>
<div id="chat-resizer" class="resize-handle" role="separator" tabindex="0" aria-label="Resize chat" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="560" aria-valuenow="320" hidden></div>
<aside id="chat-panel" class="conversation glass" aria-label="Chat" hidden><div class="drawer-heading"><h2>Chat</h2><button id="chat-close" class="icon-button" aria-label="Close chat"><svg><use href="#i-close"/></svg></button></div><div id="messages" role="log" aria-live="off"><p id="placeholder" class="placeholder">Add text to the live stream.</p></div><form id="composer"><input id="text" aria-label="Text input" placeholder="Message…" maxlength="4000" autocomplete="off"><button type="submit" class="icon-button" aria-label="Send message"><svg><use href="#i-send"/></svg></button></form></aside>
</main>
<div id="error" class="toast glass" role="status" hidden></div><div id="announce" class="sr-only" aria-live="polite"></div>
<nav class="call-controls glass" aria-label="Meeting controls"><button id="camera" class="control" aria-label="Camera" aria-pressed="false" title="Camera"><svg><use href="#i-camera"/></svg><span>Camera</span></button><button id="microphone" class="control" aria-label="Microphone" aria-pressed="false" title="Microphone"><svg><use href="#i-mic"/></svg><span>Mic</span></button><button id="speaker" class="control" aria-label="Speaker" aria-pressed="false" title="Agent speaker"><svg><use href="#i-speaker"/></svg><span>Speaker</span></button><span class="control-divider"></span><label class="control file-control" title="Play recorded video"><svg><use href="#i-video"/></svg><span>Video</span><input id="video-file" type="file" accept="video/*" aria-label="Play video"></label><label class="control file-control" title="Play recorded audio"><svg><use href="#i-audio"/></svg><span>Audio</span><input id="audio-file" type="file" accept="audio/*" aria-label="Play audio"></label><button id="chat-toggle" class="control" aria-label="Open chat" aria-expanded="false" aria-controls="chat-panel" title="Chat"><svg><use href="#i-chat"/></svg><span>Chat</span><b id="unread" hidden></b></button><button id="state-toggle" class="control" aria-label="Expand activity" aria-expanded="false" aria-controls="state-panel" title="Live activity"><svg><use href="#i-wave"/></svg><span>Activity</span></button><div class="more-wrap"><button id="more-toggle" class="control" aria-label="More input options" aria-expanded="false" title="More"><svg><use href="#i-more"/></svg><span>More</span></button><div id="more-menu" class="glass more-menu" hidden><button id="recorded">Test recording</button><button id="quiet">Quiet input</button></div></div></nav>
</body></html>
